<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Water Tank Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        .tank-title {
            font-size: 22px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 15px;
        }
        .ip-box {
            margin-bottom: 20px;
        }
        .ip-box label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .ip-box input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            width: 80%;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        
        /* Khung bình chứa dạng 3D */
        .tank-wrapper {
            position: relative;
            width: 160px;
            height: 240px;
            margin: 0 auto;
        }
        .tank {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #7f8c8d;
            border-radius: 80px / 20px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-sizing: border-box;
        }
        
        /* Vạch chia độ */
        .ruler {
            position: absolute;
            right: -15px;
            top: 15px;
            bottom: 15px;
            width: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .ruler-line {
            width: 100%;
            height: 2px;
            background-color: #555;
        }

        /* Mực nước */
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #3498db, #2980b9);
            transition: height 0.6s ease-in-out, background 0.4s ease;
        }
        .water-surface {
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 24px;
            background: #5dede7;
            border-radius: 50%;
            opacity: 0.8;
        }

        /* Cảnh báo mực nước thấp (< 20%) */
        .water.low {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
        }
        .water.low .water-surface {
            background: #ff7675;
        }

        /* Nhãn phần trăm */
        .percent-label {
            position: absolute;
            right: -60px;
            font-weight: bold;
            font-size: 16px;
            color: #3498db;
            transition: bottom 0.6s ease-in-out;
        }
        .percent-label.low {
            color: #e74c3c;
        }

        .info-panel {
            margin-top: 30px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #ccc;
        }
        .info-value {
            font-weight: bold;
            color: #00e676;
        }
        .status-text {
            margin-top: 15px;
            font-size: 13px;
            color: #ffab00;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tank-title">ESP8266 Water Tank</div>

    <div class="ip-box">
        <label for="ipInput">Địa chỉ IP ESP8266:</label>
        <input type="text" id="ipInput" value="10.49.100.34" placeholder="Nhập IP ESP8266">
    </div>

    <div class="tank-wrapper">
        <div class="tank">
            <div class="water" id="waterLevel">
                <div class="water-surface"></div>
            </div>
        </div>
        
        <div class="ruler">
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
            <div class="ruler-line"></div>
        </div>

        <div class="percent-label" id="percentText" style="bottom: 0%;">0%</div>
    </div>

    <div class="info-panel">
        <div>Điện áp A0: <span class="info-value" id="voltageVal">0.00 V</span></div>
        <div>Tín hiệu ADC: <span class="info-value" id="rawVal">0 / 1023</span></div>
    </div>

    <div class="status-text" id="statusText">Đang chờ kết nối...</div>
</div>

<script>
    function updateTankData() {
        const ip = document.getElementById("ipInput").value.trim();
        if (!ip) return;

        fetch(`http://${ip}/data`, { mode: 'cors' })
            .then(response => {
                if (!response.ok) throw new Error("Lỗi kết nối");
                return response.json();
            })
            .then(data => {
                let percent = data.percent;
                let water = document.getElementById('waterLevel');
                let percentText = document.getElementById('percentText');

                water.style.height = percent + '%';
                percentText.style.bottom = Math.max(percent - 5, 0) + '%';
                percentText.innerText = percent + '%';

                if (percent < 20) {
                    water.classList.add('low');
                    percentText.classList.add('low');
                } else {
                    water.classList.remove('low');
                    percentText.classList.remove('low');
                }

                document.getElementById('voltageVal').innerText = data.voltage + ' V';
                document.getElementById('rawVal').innerText = data.raw + ' / 1023';

                document.getElementById('statusText').innerText = "Đã kết nối thành công!";
                document.getElementById('statusText').style.color = "#00e676";
            })
            .catch(error => {
                document.getElementById('statusText').innerText = "Không kết nối được tới ESP8266!";
                document.getElementById('statusText').style.color = "#ff5252";
            });
    }

    setInterval(updateTankData, 1000);
    updateTankData();
</script>

</body>
</html>
