<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP8266 Water Tank Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        .tank-title {
            font-size: 22px;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 20px;
        }
        .tank-wrapper {
            position: relative;
            width: 160px;
            height: 240px;
            margin: 0 auto;
        }
        .tank {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #7f8c8d;
            border-radius: 80px / 20px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-sizing: border-box;
        }
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #3498db, #2980b9);
            transition: height 0.6s ease-in-out, background 0.4s ease;
        }
        .water-surface {
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 24px;
            background: #5dede7;
            border-radius: 50%;
            opacity: 0.8;
        }
        .water.low {
            background: linear-gradient(180deg, #e74c3c, #c0392b);
        }
        .water.low .water-surface {
            background: #ff7675;
        }
        .percent-label {
            position: absolute;
            right: -60px;
            font-weight: bold;
            font-size: 16px;
            color: #3498db;
            transition: bottom 0.6s ease-in-out;
        }
        .percent-label.low {
            color: #e74c3c;
        }
        .info-panel {
            margin-top: 30px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            color: #ccc;
        }
        .info-value {
            font-weight: bold;
            color: #00e676;
        }
        .status-text {
            margin-top: 15px;
            font-size: 13px;
            color: #ffab00;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tank-title">ESP8266 Water Tank</div>

    <div class="tank-wrapper">
        <div class="tank">
            <div class="water" id="waterLevel">
                <div class="water-surface"></div>
            </div>
        </div>
        <div class="percent-label" id="percentText" style="bottom: 0%;">0%</div>
    </div>

    <div class="info-panel">
        <div>Điện áp A0: <span class="info-value" id="voltageVal">0.00 V</span></div>
        <div>Tín hiệu ADC: <span class="info-value" id="rawVal">0 / 1023</span></div>
    </div>

    <div class="status-text" id="statusText">Đang tải dữ liệu từ Firebase...</div>
</div>

<script>
    const firebaseURL = "https://adcesp-63ece-default-rtdb.asia-southeast1.firebasedatabase.app/data.json";

    function updateDataFromFirebase() {
        fetch(firebaseURL)
            .then(response => {
                if (!response.ok) throw new Error("Không lấy được dữ liệu");
                return response.json();
            })
            .then(data => {
                if (!data) return;

                let percent = data.percent || 0;
                let water = document.getElementById('waterLevel');
                let percentText = document.getElementById('percentText');

                water.style.height = percent + '%';
                percentText.style.bottom = Math.max(percent - 5, 0) + '%';
                percentText.innerText = percent + '%';

                if (percent < 20) {
                    water.classList.add('low');
                    percentText.classList.add('low');
                } else {
                    water.classList.remove('low');
                    percentText.classList.remove('low');
                }

                document.getElementById('voltageVal').innerText = (data.voltage || 0) + ' V';
                document.getElementById('rawVal').innerText = (data.raw || 0) + ' / 1023';

                document.getElementById('statusText').innerText = "Đã kết nối Firebase (Thời gian thực)";
                document.getElementById('statusText').style.color = "#00e676";
            })
            .catch(error => {
                document.getElementById('statusText').innerText = "Lỗi kết nối tới Firebase!";
                document.getElementById('statusText').style.color = "#ff5252";
            });
    }

    // Cập nhật dữ liệu từ Firebase mỗi 1 giây
    setInterval(updateDataFromFirebase, 1000);
    updateDataFromFirebase();
</script>

</body>
</html>
